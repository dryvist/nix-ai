[project]
name = "mlx-server"
version = "0.1.0"
description = "Apple MLX local inference server environment"
requires-python = ">=3.14"
dependencies = [
  # Must track lib/versions.nix, which is the single source of truth for what
  # the serving path actually runs (uv run --with mlx==${versions.mlx}). This
  # file is a standalone dev environment that no nix build consumes, so a
  # divergence here is silent — it previously sat a full minor ahead after a
  # rollback updated versions.nix and missed this file.
  "mlx>=0.32.0,<0.32.1",
  "mlx-lm>=0.31.3,<0.31.4",
  "huggingface-hub>=1.26.0,<1.26.1",
]
