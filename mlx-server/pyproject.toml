[project]
name = "mlx-server"
version = "0.1.0"
description = "Apple MLX local inference server environment"
requires-python = ">=3.14"
# The single source of truth for the MLX serving stack. lib/uv-lock.nix reads
# uv.lock: lib/versions.nix takes every version below from it, and
# modules/mlx/python-overlay.nix and modules/mlx/vllm-mlx-patch.nix take each
# artifact URL and hash from it. A Renovate bump here regenerates uv.lock and
# needs no hand-edited hash anywhere.
dependencies = [
  "mlx==0.32.3",
  "mlx-lm==0.32.0",
  "mlx-vlm==0.7.4",
  "vllm-mlx==0.5.0",
  "transformers==5.18.0",
  "huggingface-hub==1.33.0",
]
