[project]
name = "mlx-server"
version = "0.1.0"
description = "Apple MLX local inference server environment"
requires-python = ">=3.14"
# The single source of truth for the MLX serving stack. lib/uv-lock.nix reads
# uv.lock: lib/versions.nix takes every version below from it, and
# modules/mlx/python-overlay.nix takes each artifact URL and hash from it. A Renovate bump here regenerates uv.lock and
# needs no hand-edited hash anywhere.
dependencies = [
  "mlx==0.32.3",
  # The CPU backend the Linux CI build of the serving env installs.
  "mlx[cpu]==0.32.3; sys_platform == 'linux'",
  "mlx-lm==0.32.0",
  # renovate: datasource=git-refs depName=mlx-vlm packageName=https://github.com/Blaizzy/mlx-vlm currentValue=pc/embeddinggemma-2
  "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@3d87e88402f307efbf68e568971aa887ee7d9ed0",
  "transformers==5.19.0",
  "huggingface-hub==1.33.0",
]
