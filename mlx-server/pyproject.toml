[project]
name = "mlx-server"
version = "0.1.0"
description = "Apple MLX local inference server environment"
requires-python = ">=3.14"
# The single source of truth for the MLX serving stack. lib/uv-lock.nix reads
# uv.lock: lib/versions.nix takes every version below from it, and
# modules/mlx/python-overlay.nix takes each artifact URL and hash from it. A Renovate bump here regenerates uv.lock and
# needs no hand-edited hash anywhere.
dependencies = [
  "mlx==0.32.4",
  # The CPU backend the Linux CI build of the serving env installs.
  "mlx[cpu]==0.32.4; sys_platform == 'linux'",
  "mlx-lm==0.32.2",
  # renovate: datasource=github-releases depName=Blaizzy/mlx-vlm packageName=Blaizzy/mlx-vlm currentValue=v0.7.8 extractVersion=^(?<version>.*)$
  "mlx-vlm @ https://github.com/Blaizzy/mlx-vlm/archive/9790231827a890eade1a626643a6bc94a1317c72.zip",
  "transformers==5.20.1",
  "huggingface-hub==1.33.0",
]

[tool.uv]
exclude-newer = "7 days"
required-version = ">=0.9.17"
# Retain the patched versions already present in the base lockfile.
constraint-dependencies = [
  "certifi>=2026.10.23",
  "filelock>=4.2.1",
]
exclude-newer-package = { certifi = "18 hours", filelock = "4 days" }
