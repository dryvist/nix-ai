# CI Gate — thin wrapper over the org reusable gate.
#
# `shared-gate` runs nix flake check (skipped for dependency-only bot PRs
# unless flake.lock moved), markdown lint, file size, token limits, pip-audit
# and the OSV differential scan from dryvist/.github. The local `gate` job
# keeps the bare `Merge Gate` context this repo's ruleset requires.
#
# Fork-PR security guard: nix-ai is a PUBLIC repository. The org gate routes
# every job through `runner_label` only for same-repo PRs and falls back to
# `ubuntu-latest` for fork PRs, so fork-author-controlled code never runs on
# the self-hosted RunsOn runners.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # actions: write must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    with:
      runner_label: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
      nix_validate: true
      # `nix flake check` evaluates the whole tree; give it the larger runner.
      # volume=80gb: the default root volume runs out of space while the
      # llama-swap and fabric Go builds compile side by side.
      nix_validate_runner_label: runs-on=${{ github.run_id }}/cpu=4/ram=16/family=m7+c7/extras=s3-cache/volume=80gb
      # Pull requests run the full cross-system suite; main pushes do too.
      all_systems: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      nix_skip_deps_only: true
      token_limits: true
      python_security: true
      python_security_dirs: mlx-server orchestrator
      # MUST mirror osv-scanner.toml `[[IgnoredVulns]]`. Each ID is documented
      # there (rationale, tracking issue #812, `ignoreUntil` review date).
      # New advisories must be added to BOTH files in lockstep.
      #   PYSEC-2026-139, CVE-2025-3000, GHSA-rrmf-rvhw-rf47 — torch 2.10.0 chain.
      #   GHSA-p4gq-832x-fm9v, PYSEC-2026-597 — nltk 3.9.4 local file load.
      #   PYSEC-2026-3740 — nltk 3.10.3 pathsec model-path sandbox bypass (unpatched).
      python_security_ignore_vulns: >-
        PYSEC-2026-139 CVE-2025-3000 GHSA-rrmf-rvhw-rf47 GHSA-p4gq-832x-fm9v PYSEC-2026-597 PYSEC-2026-3740
      osv_scan: true
      osv_config_file: osv-scanner.toml
      zizmor: true
      filters: |
        nix:
          - '.github/workflows/ci-gate.yml'
          - '**.nix'
          - 'flake.lock'
          - 'lib/**'
          - 'modules/**'
          - 'scripts/**'
        markdown:
          - '**.md'
          - '.markdownlint*'
        python:
          - 'mlx-server/**'
          - 'orchestrator/**'

  # ==========================================================================
  # MERGE GATE - The ONLY required check in branch protection
  # ==========================================================================
  gate:
    name: Merge Gate
    needs: [shared-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  ci-failure-handler:
    name: Handle CI failure
    needs: [shared-gate]
    if: >-
      always() && !cancelled() &&
      needs.shared-gate.result == 'failure' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: dryvist/ai-workflows/.github/workflows/suite-ci.yml@403af23f9212599affb14cec404199b7e05c9392
    with:
      workflow_name: CI Gate
      repo_context: "Nix home-manager modules for AI CLI tools (Claude, Gemini, Copilot, MCP servers)"
      ci_structure: "ci-gate.yml (shared Nix, Python, Ansible, OpenTofu, lint, and security gates)"
      failure_conclusion: failure
      failure_run_id: ${{ github.run_id }}
      failure_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      failure_head_branch: ${{ github.head_ref || github.ref_name }}
      failure_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      failure_head_repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.event_name != 'pull_request' && github.repository }}
      failure_actor: ${{ github.actor }}
      extra_tools: "Bash(nix *)"
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
