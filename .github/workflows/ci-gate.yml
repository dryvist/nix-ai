# CI Gate — thin wrapper over the org reusable gate.
#
# `shared-gate` runs nix flake check (skipped for dependency-only bot PRs
# unless flake.lock moved), markdown lint, file size, token limits, pip-audit
# and the OSV differential scan from JacobPEvans/.github. The local `gate` job
# keeps the bare `Merge Gate` context this repo's ruleset requires.
#
# Fork-PR security guard: nix-ai is a PUBLIC repository. The org gate routes
# every job through `runner_label` only for same-repo PRs and falls back to
# `ubuntu-latest` for fork PRs, so fork-author-controlled code never runs on
# the self-hosted RunsOn runners.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Push runs save the Nix store cache; the default branch's cache is readable
  # by PRs into develop and by develop-to-main promotions.
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # actions: write must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    with:
      runner_label: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
      nix_validate: true
      profile: nix
      # `nix flake check` evaluates the whole tree; give it the larger runner.
      # cpu=8: the check builds run in parallel (max-jobs = auto) and saturate 4 cores.
      # volume=80gb: the default root volume runs out of space while the
      # llama-swap and fabric Go builds compile side by side.
      nix_validate_runner_label: runs-on=${{ github.run_id }}/cpu=8/ram=32/family=m7+c7/extras=s3-cache/volume=80gb
      # PRs run the Linux-scoped checks; only main runs the cross-system suite.
      all_systems: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      nix_skip_deps_only: true
      token_limits: true
      python_security: true
      python_security_dirs: mlx-server orchestrator
      # MUST mirror osv-scanner.toml `[[IgnoredVulns]]`. Each ID is documented
      # there (rationale, tracking issue #812, `ignoreUntil` review date).
      # New advisories must be added to BOTH files in lockstep.
      #   PYSEC-2026-139, CVE-2025-3000, GHSA-rrmf-rvhw-rf47 — torch 2.10.0 chain.
      #   GHSA-p4gq-832x-fm9v, PYSEC-2026-597 — nltk 3.9.4 local file load.
      #   PYSEC-2026-3740 — nltk 3.10.3 pathsec model-path sandbox bypass (unpatched).
      python_security_ignore_vulns: >-
        PYSEC-2026-139 CVE-2025-3000 GHSA-rrmf-rvhw-rf47 GHSA-p4gq-832x-fm9v PYSEC-2026-597 PYSEC-2026-3740
      osv_scan: true
      osv_config_file: osv-scanner.toml
      zizmor: true
      filters: |
        nix:
          - '.github/workflows/ci-gate.yml'
          - '**.nix'
          - 'flake.lock'
          - 'lib/**'
          - 'modules/**'
          - 'scripts/**'
        markdown:
          - '**.md'
          - '.markdownlint*'
        python:
          - 'mlx-server/**'
          - 'orchestrator/**'

  lane-alias-names:
    name: Lane Alias Names
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
            http-connections = 50
            connect-timeout = 5
            stalled-download-timeout = 10
            narinfo-cache-positive-ttl = 86400
            fallback = true
            log-lines = 1000

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          save: ${{ github.event_name != 'pull_request' }}

      - name: Evaluate lane alias names
        run: nix eval --json .#lib.laneAliasParityNames > lane-alias-parity-nix-ai.json

      - name: Upload lane alias names
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-alias-names
          path: lane-alias-parity-nix-ai.json
          if-no-files-found: error

  # The reusable workflow's check job sets timeout-minutes: 5.
  lane-alias-parity:
    needs: lane-alias-names
    uses: dryvist/homelab-contracts/.github/workflows/alias-parity.yml@b600bec1b93cf09096e1ea9a712200fbc09543f5 # v5.21.0
    with:
      names-artifact: lane-alias-names
      names-files: lane-alias-parity-nix-ai.json

  flake-lock-fresh:
    name: Flake Lock Fresh
    permissions:
      contents: read
    uses: dryvist/.github/.github/workflows/_flake-lock-fresh.yml@12df22eadccd6b248ecb2d541d631d8bcf2c44e7
    with:
      max_age_days: 30

  # ==========================================================================
  # MERGE GATE - The ONLY required check in branch protection
  # ==========================================================================
  gate:
    name: Merge Gate
    needs: [shared-gate, flake-lock-fresh, lane-alias-names, lane-alias-parity]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
