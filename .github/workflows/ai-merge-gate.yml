name: AI Merge Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: read-all
jobs:
  gate:
    permissions:
      checks: read
      contents: read
      pull-requests: write
    uses: JacobPEvans/.github-ai/.github/workflows/_ai-merge-gate.yml@v2
    with:
      runner_label: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'review' || 'ubuntu-latest' }}
    secrets: inherit
