# Commit Review: an AI review of every push, on every branch.
#
# The reusable workflow diffs what the push introduced and leaves one comment
# on the head commit, written by the org's model router. Pull requests get
# PR-Agent (pr-agent.yml); this covers the commits that never sit in one.
# Queued per repository, never cancelled; a router outage waits and then fails
# rather than passing empty. Not a required check.
#
# Permissions are job-scoped and both secrets are passed explicitly (zizmor:
# excessive-permissions, secrets-inherit). No concurrency block on purpose: a
# caller sharing the reusable workflow's exact concurrency group causes an
# opaque 0-job startup_failure.

name: Commit Review

on:
  push:
    branches: ["**"]

jobs:
  commit-review:
    permissions:
      contents: write
    uses: dryvist/ai-workflows/.github/workflows/commit-review.yml@main
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
