# Fixes fetchPypi hash fields after Renovate bumps version strings.
#
# Renovate's custom regex manager updates version strings in .nix files but
# cannot update adjacent hash = "sha256-..." fields. This workflow fires on
# every push to a Renovate branch, re-runs nix-update for the affected
# packages, and commits corrected hashes back before CI runs.
#
# Packages covered: cecli, mcp (via cecli passthru), and zcode (source and
# pnpm dependency hashes in modules/zcode/package.nix). The MLX Python stack
# needs no step here: its hashes come from mlx-server/uv.lock,
# which Renovate regenerates itself.
# Add new packages here and to the packages output in flake.nix when needed.
name: Fix Renovate hash updates

permissions: {}

on:
  push:
    branches:
      - "renovate/**"

jobs:
  fix-hashes:
    name: Update fetchPypi hashes
    runs-on: ubuntu-latest
    environment: automation
    permissions: {}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Scoped to what the job does: push hash-fix commits to the branch.
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5

      - name: Update mcp hash
        run: nix run nixpkgs#nix-update -- --flake mcp --version="$(nix eval --raw .#mcp.version)"

      - name: Update cecli hash
        run: nix run nixpkgs#nix-update -- --flake cecli --version="$(nix eval --raw .#cecli.version)"

      - name: Update zcode hashes
        run: nix run nixpkgs#nix-update -- --flake zcode --override-filename modules/zcode/package.nix --version=skip

      # Commits through the GraphQL API, so GitHub signs it (Verified).
      - name: Commit hash fixes
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "fix(deps): update package hashes after a version bump"
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          file_pattern: modules/cecli/package.nix modules/zcode/package.nix
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
