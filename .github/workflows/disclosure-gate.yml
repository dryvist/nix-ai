---
# Disclosure Gate — thin wrapper over the dryvist org reusable workflow
#
# Delegates the gitleaks and disclosure-denylist checks to
# `dryvist/.github/.github/workflows/_disclosure-gate.yml@<40-hex commit SHA> # vX.Y.Z`.

name: Disclosure Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  disclosure-gate:
    permissions:
      contents: read
      pull-requests: read
    uses: dryvist/.github/.github/workflows/_disclosure-gate.yml@10af73f872e043e91ff6327d0ef2548881f61298 # v1.11.2
    secrets:
      GITLEAKS_PRIVATE_CONFIG: ${{ secrets.GITLEAKS_PRIVATE_CONFIG }}
      GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}
      DISCLOSURE_DENYLIST: ${{ secrets.DISCLOSURE_DENYLIST }}
