---
# Moves the floating major tag to each stable release. The shared workflow holds
# the logic; this caller only passes the published release tag.
name: Promote Major Tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote-major-tag:
    permissions:
      contents: write
      checks: read
    uses: dryvist/.github/.github/workflows/promote-major-tag.yml@aeab7c1ac2a9dc807e468fc507ad5b5c1c93df8c # v1.11.4
    with:
      tag: ${{ github.event.release.tag_name }}
