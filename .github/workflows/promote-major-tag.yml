---
# Moves the floating major tag to each stable release. The shared workflow holds
# the logic; this caller only passes the published release tag.
name: Promote Major Tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote-major-tag:
    permissions:
      contents: write
      checks: read
    uses: dryvist/.github/.github/workflows/promote-major-tag.yml@41ca3a7c0f8853acbfa38ef905a6231cdddf968d # v1.19.0
    with:
      tag: ${{ github.event.release.tag_name }}
